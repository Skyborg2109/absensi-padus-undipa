<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padus Undipa</title>
    <script>
      const base = "/absensi-padus-undipa/";
      const pathname = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length)
        : window.location.pathname.replace(/^\/+/, "");
      const route = pathname && pathname !== "index.html" ? `/${pathname.replace(/^\/+/, "")}` : "/";
      window.location.replace(`${window.location.origin}${base}#${route}`);
    </script>
  </head>
  <body>
    <p>Mengalihkan ke aplikasi Padus Undipa…</p>
  </body>
</html>
